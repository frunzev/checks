[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "configuration",
    "tests",
    "checks/experimental/single-responsibility",
    "checks/experimental/semantic-duplicates",
    "checks/experimental/open-closed",
]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["configuration"]
venvPath = "."
venv = ".venv"
extraPaths = ["configuration"]
